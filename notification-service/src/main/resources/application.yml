server:
  port: 9004

spring:
  application:
    name: NOTIFICATION-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/heathcare
    driverClassName: org.postgresql.Driver
    username: postgres
    password: root
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: notification_service
        hbm2ddl.create_namespaces: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.healthCare.notification.kafka"
        spring.json.value.default.type: "com.healthCare.notification.kafka.NotificationEvent"
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ── Firebase Cloud Messaging ────────────────────────────────────────────────
firebase:
  service-account-path: classpath:firebase-service-account.json

# ── Onboarding service base URL (for fetching FCM tokens via /api/internal/**) ──
onboarding-service:
  url: http://localhost:9001

# ── Apache Kafka ──────────────────────────────────────────────────────────────

# ── Kafka Topic Names ─────────────────────────────────────────────────────────
kafka:
  topics:
    notification-events: notification-events


